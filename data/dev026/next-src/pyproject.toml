[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "price-action-research-lab"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "numpy>=2.1,<2.4", "pandas>=2.2,<3", "pyarrow>=19,<25", "duckdb>=1.2,<2",
  "exchange-calendars>=4.9,<5", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "scipy>=1.15,<2", "numba>=0.61,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
